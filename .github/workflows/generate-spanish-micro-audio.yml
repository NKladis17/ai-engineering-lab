name: Generate Spanish micro-learning audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-spanish-micro-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --disable-pip-version-check edge-tts

      - name: Generate eleven Spanish recordings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/spanish-micro-learning/audio
          rm -f docs/spanish-micro-learning/audio/card_*.mp3

          python - <<'PY'
          import asyncio
          from pathlib import Path
          import edge_tts

          voice = 'es-ES-AlvaroNeural'
          sentences = {
              1: 'Hace pocos días que te conozco y parece como si hiciera muchos años.',
              2: 'Lo que propones tiene sentido, pero quizá habría que darle una vuelta más antes de tomar una decisión.',
              3: 'Cuanto más lo pienso, más claro tengo que deberíamos esperar.',
              4: 'Perdona que te interrumpa, pero hay un detalle importante que deberíamos tener en cuenta.',
              5: 'Si estuviera en tu lugar, empezaría por la opción más sencilla.',
              6: 'Menos mal que me avisaste; si no, habría llegado al lugar equivocado.',
              7: 'No quiero que esto se convierta en una discusión; prefiero que intentemos entendernos.',
              8: 'No es que no quisiera contestarte; es que necesitaba aclarar algunas cosas antes de hacerlo.',
              9: 'Haré todo lo posible por terminarlo hoy, aunque no puedo prometerte que esté listo a tiempo.',
              10: 'De haber sabido que ibas a venir, habría organizado el día de otra manera.',
              11: 'Podríamos dejarlo así por ahora, siempre que revisemos los detalles más adelante.',
          }

          async def make(card_id: int, text: str) -> None:
              target = Path('docs/spanish-micro-learning/audio') / f'card_{card_id:02d}_raw.mp3'
              speech = edge_tts.Communicate(
                  text=text,
                  voice=voice,
                  rate='+0%',
                  volume='+0%',
                  pitch='-2Hz',
              )
              await speech.save(str(target))

          async def main() -> None:
              for card_id, text in sentences.items():
                  await make(card_id, text)

          asyncio.run(main())
          PY

          for raw in docs/spanish-micro-learning/audio/card_*_raw.mp3; do
            final="${raw/_raw/}"
            ffmpeg -hide_banner -loglevel error -y -i "$raw" \
              -af "silenceremove=start_periods=1:start_silence=0.04:start_threshold=-50dB,areverse,silenceremove=start_periods=1:start_silence=0.10:start_threshold=-50dB,areverse,loudnorm=I=-16:TP=-1.5:LRA=8" \
              -codec:a libmp3lame -b:a 192k "$final"
            rm "$raw"
          done

          cat > docs/spanish-micro-learning/audio/manifest.json <<'JSON'
          {
            "voice": "es-ES-AlvaroNeural",
            "locale": "Spanish (Spain)",
            "cards": 11,
            "defaultPlaybackRate": 0.85,
            "normalPlaybackRate": 1.0
          }
          JSON

      - name: Build one self-contained HTML file
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://at.adobe.com/Sdqknw4YFk6KkF4C' \
            -o docs/spanish-micro-learning/index.template.html

          grep -q 'Spanish Micro-Learning Cards 1–11' docs/spanish-micro-learning/index.template.html

          python - <<'PY'
          from pathlib import Path
          import base64

          root = Path('docs/spanish-micro-learning')
          template = root / 'index.template.html'
          html = template.read_text(encoding='utf-8')

          for card_id in range(1, 12):
              audio_path = root / 'audio' / f'card_{card_id:02d}.mp3'
              encoded = base64.b64encode(audio_path.read_bytes()).decode('ascii')
              remote = (
                  'https://raw.githubusercontent.com/NKladis17/ai-engineering-lab/'
                  f'main/docs/spanish-micro-learning/audio/card_{card_id:02d}.mp3'
              )
              replacement = f'data:audio/mpeg;base64,{encoded}'
              if remote not in html:
                  raise RuntimeError(f'Missing audio URL for Card {card_id}')
              html = html.replace(remote, replacement, 1)

          output = root / 'index.html'
          output.write_text(html, encoding='utf-8')
          template.unlink()
          PY

      - name: Validate audio and webpage
        shell: bash
        run: |
          set -euo pipefail
          test "$(find docs/spanish-micro-learning/audio -name 'card_*.mp3' | wc -l)" -eq 11
          for file in docs/spanish-micro-learning/audio/card_*.mp3; do
            test "$(wc -c < "$file")" -gt 15000
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$file"
          done
          test "$(grep -o 'data:audio/mpeg;base64,' docs/spanish-micro-learning/index.html | wc -l)" -eq 11
          ! grep -q 'raw.githubusercontent.com' docs/spanish-micro-learning/index.html
          test "$(grep -o 'class="page page-' docs/spanish-micro-learning/index.html | wc -l)" -eq 11
          test "$(wc -c < docs/spanish-micro-learning/index.html)" -gt 900000

      - name: Commit completed deck
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/spanish-micro-learning
          git diff --cached --quiet && exit 0
          git commit -m 'Extend Spanish micro-learning deck to cards 1-11 with neural audio [skip ci]'
          git push

      - name: Upload completed HTML
        uses: actions/upload-artifact@v4
        with:
          name: Spanish-Micro-Learning-Cards-1-11
          path: docs/spanish-micro-learning/index.html
          if-no-files-found: error
          retention-days: 30
