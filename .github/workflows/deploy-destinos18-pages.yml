name: Deploy Destinos 18 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/destinos18/**'
      - '.github/workflows/deploy-destinos18-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Destinos site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment URL
        run: |
          mkdir -p deployment-status
          printf '%s\n' "${{ steps.deployment.outputs.page_url }}destinos18/" > deployment-status/destinos18-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status/destinos18-url.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record Destinos 18 live site URL"
          git push
